  notes: |
    IMPORTANT RECLASSIFICATION: This is a first-principles molecular dynamics study,
    NOT an experimental kinetics paper. It contains NO measured rate constants,
    NO Arrhenius parameters, and NO digitizable experimental data.

    Its scientific contribution is qualitative branching of Cl2•- decay:
    - In ZnCl2 melt: 2 Cl2•- -> Cl2 + 2 Cl-  (vehicular transport of Cl2)
    - In LiCl-KCl eutectic: 2 Cl2•- -> Cl3- + Cl-  (Grotthuss-like exchange to form Cl3-)

    Simulations performed at 673 K (bulk) and 773 K (interfacial). 149 ZnCl2 formula units,
    36.5 ps trajectories.

    This case is therefore best treated as a STRUCTURAL/MECHANISTIC reference for
    parametrizing the branching ratio in the kinetic model — not a data source for
    Bayesian inference. The branching parameter (fraction_to_Cl3 vs fraction_to_Cl2)
    is what the user might extract from a fit to multiple kinetic experiments (e.g.,
    Iwamatsu 2022 in LiCl-KCl gives fraction_to_Cl3 ~ 1; Iwamatsu Zn paper Section
    on neat ZnCl2 gives fraction_to_Cl2 ~ 1).

