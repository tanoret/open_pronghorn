notes: |
  Treat this as a MECHANISTIC reference, not a data point. To use it:
  - Adopt the qualitative branching: in LiCl-KCl chemistry, the Cl2•- + Cl2•- -> Cl- + Cl3- channel dominates.
  - In high-Lewis-acidity ZnCl2 melts, the Cl2•- + Cl2•- -> Cl2_diss + 2 Cl- channel dominates.
  - The numerical value of the branching ratio still needs experimental fit (against Iwamatsu 2022
    Cl2•- decay data, which the current Cl2•- -> Cl3- + Cl- reaction in database.yaml already
    captures for LiCl-KCl).
