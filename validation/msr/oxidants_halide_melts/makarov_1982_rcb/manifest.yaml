case_id: oxidants_halide_melts_makarov_1982
title: "Oxidizing agents produced by radiolysis of alkali-metal halide melts"

citation:
  authors: "Makarov, I. E.; Zhukova, T. N.; Pikaev, A. K.; Spitzyn, V. I."
  journal: "Bulletin of the Academy of Sciences USSR, Division of Chemical Science (English Translation)"
  year: 1982
  volume: 31
