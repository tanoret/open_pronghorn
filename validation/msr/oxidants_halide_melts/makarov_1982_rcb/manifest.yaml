  notes: |
    Companion to Pikaev 1982 (RPC). Identifies and quantifies oxidants produced in
    radiolyzed alkali halide melts (X2•-, X3-, possibly X2). Provides yield estimates
    that complement the rate-constant data from the kinetic studies. Reports:
    - X2•- and X3- production yields under gamma irradiation
    - Reactivity vs reducing agents
    - Likely G-values for X2 or X3- equivalent to F2 production in fluorides.

