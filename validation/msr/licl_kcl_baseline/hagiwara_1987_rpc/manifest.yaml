case_id: licl_kcl_baseline_hagiwara_1987
title: "Baseline pulse radiolysis study of LiCl-KCl eutectic at 400 °C"

citation:
  authors: "Hagiwara, H.; Sawamura, S.; Sumiyoshi, T.; Katayama, M."
  journal: "Radiation Physics and Chemistry"
  year: 1987
  volume: 30
  issue: 2
  pages: "143"
  also: "Cited as ref. (8) in Conrad et al. PCCP 2023"

digitization:
  tool: ""
  figures: []
  date_extracted: ""
  digitized_by: ""
  notes: |
    The first pulse-radiolysis kinetic study of LiCl-KCl eutectic.
    Reports:
    - e_s- lifetime of ~250 ns in LiCl-KCl at 400 °C (background, impurity-limited)
    - Cl2•- disproportionation Ea ≈ 24 kJ/mol (confirmed within ~10 % by Iwamatsu 2022 at 26 ± 2)
    Important historical baseline against which Iwamatsu et al.'s modern values are compared.

