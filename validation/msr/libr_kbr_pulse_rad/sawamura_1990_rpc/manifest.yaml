case_id: libr_kbr_pulse_rad_sawamura_1990
title: "Pulse radiolysis of LiBr-KBr melts - transient absorption spectra"

citation:
  authors: "Sawamura, S.; Gebicki, J. L.; Mayer, J.; Kroh, J."
  journal: "Radiation Physics and Chemistry"
  year: 1990
  volume: 46
  issue: 2
  pages: "433"
  also: "Cited as ref. (9) in Conrad et al. PCCP 2023"

digitization:
  tool: ""
  figures: []
  date_extracted: ""
  digitized_by: ""
  notes: |
    Extends the alkali-halide pulse-rad inventory to BROMIDE melts. Provides
    e_s-, Br•, Br2•- (and possibly Br3-) absorption spectra and decay kinetics.
    Mostly relevant as a cross-validation for the halide-melt mechanism: shifts
    in λ_max, decay rates with anion identity, comparison to Cl2•- in LiCl-KCl.

