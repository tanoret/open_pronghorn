    Characterized via diffuse reflectance + EPR up to 100 kGy. Reports:
    - Color centers (F-centers, X2- centers)
    - Long-lived radical species observable post-irradiation
    - Metal nanoparticle nucleation from radiolytically-produced metal atoms in KCl-MgCl2

