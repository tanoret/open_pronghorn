notes: |
  STUB. Solid-phase data — primarily diagnostic, not directly applicable to the molten kinetic model.
  However:
  1. EPR-identified species can inform what species the molten model should track.
  2. KCl-MgCl2 is the matrix for MCFR fuel salts — this data informs about frozen-salt risk.
  3. Long-lived transient inventory (after radiolysis stops) tests the model's quasi-stationary limit.
  Consider whether a "solid-phase" companion model is in scope.
