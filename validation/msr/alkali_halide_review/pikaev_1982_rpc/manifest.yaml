  notes: |
    SEMINAL REVIEW. Covers solvated electrons in NaCl, KCl, NaBr, KI, and mixtures.
    Microsecond pulse radiolysis. Reports:
    - Optical absorption spectra at multiple T
    - Reactivity with Zn2+, Cd2+, Pb2+ in NaCl/KCl melts (Iwamatsu 2022 cites k = 1.7e9
      in NaCl @850 °C and 2.8e9 in KCl @800 °C for e_s- + Zn2+ -> Zn+)
    - X2•- molecular radical anions identified across the alkali halide series
    Caveat per Iwamatsu 2022: "these values are essentially best-guess estimates, as they
    are based on observed eS- yields at the edge of a 2.3 µs-long electron pulse" — so
    Pikaev's rate values have systematic uncertainty that modern picosecond LEAF data has reduced.

