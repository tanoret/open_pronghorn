notes: |
  STUB. The Pikaev review provides cross-cutting validation across the alkali halide
  series. To activate:
  1. Locate the 1982 RPC paper and the companion Russian works (3-7 above).
  2. Digitize spectra and decay traces if available.
  3. Add NaCl and KCl as separate kernels (or add a "kernel" parameter for cation identity)
     to capture e_s- absorption shifts and decay rate differences across cations.

  Note: Pikaev's Zn2+ rates (1.7e9, 2.8e9) are an order of magnitude lower than Iwamatsu 2022's
  LiCl-KCl value (~4e10 at 400 °C). Iwamatsu attributes this to the time-resolution of Pikaev's
  experiments. Use this discrepancy as a CONSISTENCY CHECK: a Bayesian fit should treat the
  two papers' rate constants as having different prior weights.
