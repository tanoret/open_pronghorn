  notes: |
    RECLASSIFICATION: Computational paper using first-principles molecular dynamics.
    NO experimental rate constants. NO molar absorption coefficients. NO Arrhenius parameters.
    Earlier stub mis-attributed authorship to "Gibson et al." — the correct lead authors are
    Nguyen, Bryantsev, Margulis.

    The paper identifies THREE distinct electronic states for an excess electron in molten ZnCl2:
      (1) Delocalized electron with broad visible-to-mid-IR absorption.
      (2) Zn2Cl5•(2-) radical anion - localized covalent state, absorbs <575 nm (peak 400-550 nm).
      (3) ZnCl3•(2-) solvated Zn(I) species - absorption extends to 650 nm.

    Simulation conditions: T = 600.15 K, 149 ZnCl2 formula units, 36.5 ps trajectory.

    This is RELEVANT for our chloride kernel because it shows the e_s- description used
    in alkali chloride melts (single solvated electron) does NOT apply to high-Lewis-acidity
    melts like ZnCl2. If we want to model neat ZnCl2 radiolysis, the kinetic network must
    distinguish at least two electron states with different reactivities.

