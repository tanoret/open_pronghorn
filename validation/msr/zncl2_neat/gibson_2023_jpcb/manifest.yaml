notes: |
  Mechanistic reference; not directly usable for Bayesian inference. Use to inform model design:
  - For neat ZnCl2: tracking a single "e_s-" species is an approximation that conflates three
    distinct electronic states with different absorption maxima and reactivities.
  - For LiCl-KCl eutectic: single "e_s-" treatment remains valid per Horne 2018 JPC C and
    the Iwamatsu/Conrad experimental series.
