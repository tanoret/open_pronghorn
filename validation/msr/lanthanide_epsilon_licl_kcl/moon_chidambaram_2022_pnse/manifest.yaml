case_id: lanthanide_epsilon_moon_2022
title: "Molar absorption coefficients of trivalent lanthanides (Nd, Sm, Dy) in LiCl-KCl at 500 °C"

context_kind: "calibration/spectroscopy"

citation:
  authors: "Moon, J.; Chidambaram, D."
  journal: "Progress in Nuclear Energy"
  year: 2022
  volume: 152
  pages: "104375"
  doi: "10.1016/j.pnucene.2022.104375"
  osti: "2418345"
  url: "https://www.osti.gov/biblio/2418345"
  also: |
    Kim & Yun 2016 UV-Vis literature comparison values included in Table 2 of the paper.
    Fujii and coworkers reported Nd3+ molar absorbance up to 900 nm at 600 °C.

digitization:
  tool: "PDF text extraction (pdftotext)"
  figures: ["Table 1 (concentration mol-% conversions)", "Table 2 (molar absorption coefficients)"]
  date_extracted: "2026-05"
  digitized_by: "Claude (from OSTI public PDF)"
  notes: |
    Data in data/:
    - epsilon_table2.csv: 20 absorption peaks for Sm3+, Nd3+, Dy3+ in LiCl-KCl at 500 °C
      with epsilon in M^-1 cm^-1 and 1-sigma uncertainties.
    This is the foundational reference for converting absorbance to absolute concentration
    in any lanthanide-doped LiCl-KCl validation case (most notably Iwamatsu 2026 Inorg. Chem.
    on Nd(II)/Nd(III) pulse radiolysis — currently stubbed in validation/nd_licl_kcl/).

    Cross-references for ε of TRANSIENT species (e_s-, Cl2•-) at 400-600 °C — NOT this paper,
    which only covers steady-state Ln3+ absorption. The transient ε values would need to come
    from Horne et al. JPC C 2018 (still stubbed) or other dedicated pulse-radiolysis spectroscopy.

system: {kernel: chloride, temperature_K: 773.15, liquid_volume_m3: 1.0e-3, headspace_volume_m3: 0.0, kLa_s^-1: 0.0, dose_rate_J_m3_s: 0.0, radiation: gamma, initial_concentrations: {Cl-: 2.0e4}, metals: {}, gas_species: []}
integration: {t_final_s: 1.0, n_steps: 10}

