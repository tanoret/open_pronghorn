  - file: data/epsilon_table2.csv
    description: "20 absorption peaks for Sm3+, Nd3+, Dy3+ at 500 °C with epsilon and sigma"

traces: []
metrics: []

notes: |
  This case is a SPECTROSCOPIC CALIBRATION reference, not a kinetic validation. It enables
  the harness to use observable kind = "absorbance" (with epsilon and path length) in
  lanthanide validation cases instead of `absorbance_scale_free`. Once Iwamatsu 2026 Nd
  pulse-rad data is digitized, the Nd3+ epsilon values from this paper let us convert
  absorbance to mol/m^3 for direct quantitative comparison.

  Caveats:
  - Paper is at 500 °C; pulse-rad temperatures (400-700 °C) may differ.
  - For ION CHLORIDE concentration: paper uses 30-480 mM range; lower concentrations
    (1-5 mM for radiolysis) may have somewhat different ε due to coordination changes.
  - Sm3+, Nd3+, Dy3+ only — other lanthanides (Eu, Yb, Ce, Pr, Ho, Er) not covered.
