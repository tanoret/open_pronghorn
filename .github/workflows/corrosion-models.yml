      - name: Probe pre-existing TestHarness cases
        id: harness_existing
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          env -u MSTDB_TC_DIR ./run_tests
          --re='^(?!.*(?:action_potential_pin|action_solid_only|advanced_models)).*$'
          -j "${MOOSE_JOBS}"

      - name: GATE-FAIL pre-existing TestHarness cases
