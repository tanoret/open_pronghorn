name: Corrosion models

on:
  pull_request:
    branches:
      - pr_corrosion
  push:
    branches:
      - pr_corrosion

permissions:
  contents: read

concurrency:
  group: corrosion-models-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-validation:
    name: Portable model validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out OpenPronghorn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify tracked artifacts and licensed-data exclusion
        run: |
          git ls-files --error-unmatch \
            THIRD_PARTY_NOTICES.md \
            data/advanced_corrosion_models.json \
            unit/data/dridn/cpp_parity_cases.csv \
            unit/data/dridn/fitted_parameters.csv \
            validation/corrosion/calibration/data/parameters.json \
            validation/corrosion/calibration/data/targets.csv \
            test/tests/corrosion/advanced_models/advanced_models_synthetic.json

          fluoride_sha="a7ca53e6061c3aa16d1932e35f908fa61b328b88625e8361e63881bfc8592000"
          chloride_sha="460e8d7148cc76c597064e167b4afa98ea762e59a666f9c42962f3d2d013e5c1"
          while IFS= read -r -d '' path; do
            if [[ -f "${path}" && ! -L "${path}" ]]; then
              digest="$(sha256sum -- "${path}" | cut -d ' ' -f 1)"
              if [[ "${digest}" == "${fluoride_sha}" || "${digest}" == "${chloride_sha}" ]]; then
                echo "Licensed MSTDB-TC V3.1 data must not be committed: ${path}" >&2
                exit 1
              fi
            fi
          done < <(git ls-files -z)

      - name: Set up the pinned scientific Python environment
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: validation/corrosion/calibration/requirements.txt

      - name: Install calibration requirements
        run: |
          python -m pip install --requirement validation/corrosion/calibration/requirements.txt
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.13"
          python -m pip check

      - name: Run portable corrosion-model validation
        working-directory: validation/corrosion/calibration
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: env -u MSTDB_TC_DIR python -m unittest discover --start-directory tests --verbose

      - name: Validate the experimental target matrix
        run: >-
          python validation/corrosion/experimental_target_matrix.py
          --output "${RUNNER_TEMP}/experimental_target_matrix.csv"

  linked-moose:
    name: Linked MOOSE build and tests
    needs: portable-validation
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      METHOD: opt
      MOOSE_DIR: ${{ github.workspace }}/moose
      MOOSE_JOBS: "2"
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Require portable model validation
        env:
          PORTABLE_RESULT: ${{ needs['portable-validation'].result }}
        run: test "${PORTABLE_RESULT}" = success

      - name: Check out OpenPronghorn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the pinned MOOSE submodule shallowly
        run: |
          git submodule sync -- moose
          git submodule update --init --depth=1 moose

      - name: Set up the pinned MOOSE development environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: moose
          auto-update-conda: false
          channel-priority: strict
          channels: https://conda.software.inl.gov/public,conda-forge
          conda-remove-defaults: true
          miniforge-version: "26.5.3-0"

      - name: Install the pinned MOOSE dependencies
        run: |
          conda install --yes "python=3.12" "moose-dev=2026.02.20=mpich"
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          conda list --explicit

      - name: Verify the pinned MOOSE revision and dependency release
        run: |
          test "$(git -C moose rev-parse HEAD)" = "fcf1619600f293e8ab26d8b6fb1eec9e4997fefd"
          grep --fixed-strings '{% set version = "2026.02.20" %}' moose/conda/moose-dev/meta.yaml
          conda list moose-dev

      - name: Check changed-file whitespace
        run: |
          base="$(git rev-parse HEAD^1)"
          git diff --check "${base}...HEAD"

      - name: Probe clang-format include/corrosion/actions/CorrosionPlatingAction.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/actions/CorrosionPlatingAction.h'

      - name: Probe clang-format include/corrosion/actions/CorrosionPlatingActionUtils.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/actions/CorrosionPlatingActionUtils.h'

      - name: Probe clang-format include/corrosion/actions/CorrosionPlatingFlowAction.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/actions/CorrosionPlatingFlowAction.h'

      - name: Probe clang-format include/corrosion/auxkernels/CorrosionRateAux.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/auxkernels/CorrosionRateAux.h'

      - name: Probe clang-format include/corrosion/auxkernels/CorrosionTotalRateAux.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/auxkernels/CorrosionTotalRateAux.h'

      - name: Probe clang-format include/corrosion/base/AdvancedCorrosionModelData.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/base/AdvancedCorrosionModelData.h'

      - name: Probe clang-format include/corrosion/base/DRIDNModel.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/base/DRIDNModel.h'

      - name: Probe clang-format include/corrosion/base/MSTDBTCData.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/base/MSTDBTCData.h'

      - name: Probe clang-format include/corrosion/base/MSTDBTCStandardStateCorrosionModel.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/base/MSTDBTCStandardStateCorrosionModel.h'

      - name: Probe clang-format include/corrosion/postprocessors/AdvancedCorrosionModelPostprocessor.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/postprocessors/AdvancedCorrosionModelPostprocessor.h'

      - name: Probe clang-format include/corrosion/userobjects/AdvancedCorrosionModelUserObject.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/userobjects/AdvancedCorrosionModelUserObject.h'

      - name: Probe clang-format include/corrosion/userobjects/DRIDNCorrosionUserObject.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/userobjects/DRIDNCorrosionUserObject.h'

      - name: Probe clang-format include/corrosion/userobjects/MSTDBTCCorrosionUserObject.h
        continue-on-error: true
        run: clang-format --dry-run --Werror 'include/corrosion/userobjects/MSTDBTCCorrosionUserObject.h'

      - name: Probe clang-format src/corrosion/actions/CorrosionPlatingAction.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/actions/CorrosionPlatingAction.C'

      - name: Probe clang-format src/corrosion/actions/CorrosionPlatingFlowAction.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/actions/CorrosionPlatingFlowAction.C'

      - name: Probe clang-format src/corrosion/auxkernels/CorrosionRateAux.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/auxkernels/CorrosionRateAux.C'

      - name: Probe clang-format src/corrosion/auxkernels/CorrosionTotalRateAux.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/auxkernels/CorrosionTotalRateAux.C'

      - name: Probe clang-format src/corrosion/base/AdvancedCorrosionModelData.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/base/AdvancedCorrosionModelData.C'

      - name: Probe clang-format src/corrosion/base/DRIDNModel.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/base/DRIDNModel.C'

      - name: Probe clang-format src/corrosion/base/MSTDBTCData.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/base/MSTDBTCData.C'

      - name: Probe clang-format src/corrosion/base/MSTDBTCStandardStateCorrosionModel.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/base/MSTDBTCStandardStateCorrosionModel.C'

      - name: Probe clang-format src/corrosion/postprocessors/AdvancedCorrosionModelPostprocessor.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/postprocessors/AdvancedCorrosionModelPostprocessor.C'

      - name: Probe clang-format src/corrosion/userobjects/AdvancedCorrosionModelUserObject.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/userobjects/AdvancedCorrosionModelUserObject.C'

      - name: Probe clang-format src/corrosion/userobjects/DRIDNCorrosionUserObject.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/userobjects/DRIDNCorrosionUserObject.C'

      - name: Probe clang-format src/corrosion/userobjects/MSTDBTCCorrosionUserObject.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'src/corrosion/userobjects/MSTDBTCCorrosionUserObject.C'

      - name: Probe clang-format unit/src/AdvancedCorrosionModelDataTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/AdvancedCorrosionModelDataTest.C'

      - name: Probe clang-format unit/src/CorrosionPlatingActionUtilsTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/CorrosionPlatingActionUtilsTest.C'

      - name: Probe clang-format unit/src/DRIDNModelTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/DRIDNModelTest.C'

      - name: Probe clang-format unit/src/DRIDNParityTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/DRIDNParityTest.C'

      - name: Probe clang-format unit/src/MSTDBTCDataTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/MSTDBTCDataTest.C'

      - name: Probe clang-format unit/src/MSTDBTCStandardStateCorrosionModelTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/MSTDBTCStandardStateCorrosionModelTest.C'

      - name: Probe clang-format unit/src/MSTDBTCV31IntegrationTest.C
        continue-on-error: true
        run: clang-format --dry-run --Werror 'unit/src/MSTDBTCV31IntegrationTest.C'

      - name: Check changed-source formatting
        run: |
          base="$(git rev-parse HEAD^1)"
          mapfile -t sources < <(
            git diff --diff-filter=ACMR --name-only "${base}...HEAD" -- '*.C' '*.h'
          )
          if ((${#sources[@]})); then
            clang-format --dry-run --Werror "${sources[@]}"
          fi

      - name: Build OpenPronghorn
        run: make --jobs="${MOOSE_JOBS}"

      - name: Reproduce all 76 effective-model Action cases
        run: >-
          env -u MSTDB_TC_DIR python validation/corrosion/run_corrosion_validation.py
          --case-timeout 10

      - name: Build and run C++ unit tests
        run: |
          make --directory=unit --jobs="${MOOSE_JOBS}"
          env -u MSTDB_TC_DIR ./unit/open_pronghorn-unit-opt

      - name: Check and build documentation
        working-directory: doc
        run: |
          ./moosedocs.py check --config sqa_reports.yml
          ./moosedocs.py build --config config.yml

      - name: Run the complete OpenPronghorn TestHarness
        run: env -u MSTDB_TC_DIR ./run_tests -j "${MOOSE_JOBS}"
