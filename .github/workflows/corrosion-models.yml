      - name: Run the complete OpenPronghorn TestHarness
        id: test_harness
        continue-on-error: true
        run: env -u MSTDB_TC_DIR ./run_tests -j "${MOOSE_JOBS}"

      - name: Probe action-potential-pin TestHarness suite
        id: harness_suite_pin
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          env -u MSTDB_TC_DIR ./run_tests --spec-file test/tests/corrosion/action_potential_pin/tests
          -j "${MOOSE_JOBS}"

      - name: GATE-FAIL action-potential-pin TestHarness suite
        if: ${{ always() && steps.harness_suite_pin.outcome == 'failure' }}
        run: "true"

      - name: Probe solid-only TestHarness suite
